<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid RAG</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; --border: #dddddd; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eaeaea; --muted: #9a9a9a; --border: #333333; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
    max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  input[type=text] {
    flex: 1; padding: 0.6rem 0.8rem; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  button {
    padding: 0.6rem 1.2rem; font-size: 1rem; border: none; border-radius: 6px;
    background: var(--accent); color: white; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--muted); font-size: 0.9rem; min-height: 1.2rem; margin-bottom: 1rem; }
  #answer { line-height: 1.6; white-space: pre-wrap; margin-bottom: 1.5rem; }
  .cite { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
  #sources { border-top: 1px solid var(--border); padding-top: 1rem; }
  #sources h2 { font-size: 1rem; margin-bottom: 0.6rem; }
  .source { padding: 0.5rem 0.6rem; border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.9rem; }
  .source.highlight { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  #error { color: #dc2626; margin-bottom: 1rem; }
</style>
</head>
<body>
  <h1>Hybrid RAG</h1>
  <p class="sub">Ask a question about the indexed neuroplasticity papers.</p>

  <form id="ask-form">
    <input type="text" id="question" placeholder="Ask a question..." autocomplete="off" required>
    <button type="submit" id="submit-btn">Ask</button>
  </form>

  <div id="status"></div>
  <div id="error"></div>
  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const button = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderAnswer(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/\[(\d+)\]/g, (match, n) =>
        `<a class="cite" href="#source-${n}" onclick="highlightSource(${n})">[${n}]</a>`
      );
    }

    window.highlightSource = function (n) {
      document.querySelectorAll(".source").forEach(el => el.classList.remove("highlight"));
      const el = document.getElementById(`source-${n}`);
      if (el) el.classList.add("highlight");
    };

    function renderSources(citations) {
      if (!citations.length) { sourcesEl.innerHTML = ""; return; }
      const items = citations.map(c => `
        <div class="source" id="source-${c.number}">
          <strong>[${c.number}]</strong> ${escapeHtml(c.location)}
        </div>
      `).join("");
      sourcesEl.innerHTML = `<h2>Sources</h2>${items}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      button.disabled = true;
      statusEl.textContent = "Thinking... (retrieval + reranking + LLM, usually a few seconds)";
      errorEl.textContent = "";
      answerEl.textContent = "";
      sourcesEl.innerHTML = "";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: question }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
        answerEl.innerHTML = renderAnswer(body.answer);
        renderSources(body.citations);
        statusEl.textContent = `Mode: ${body.mode}`;
      } catch (err) {
        errorEl.textContent = err.message;
        statusEl.textContent = "";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
